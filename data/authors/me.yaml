experience:
  - role: Principal Investigator & Independent AI Safety Researcher
    org: Machine Psychology & LLM Alignment
    start: present
    summary: |
      - Architected and Executed Advanced Red-Teaming Protocols: Designed novel black-box evaluation frameworks, including Infinite Recursive Self-Excavation (IRSE) and Orthogonal Axes Persona Disintegration (OAPD), to stress-test 6 frontier Large Language Models (ChatGPT, Claude, Gemini, Grok, DeepSeek, Qwen).
      - Pioneered Identification of Novel LLM Behavioral Modes: Formally identified and mathematically quantified several previously undocumented vulnerabilities and latent behavioral patterns in frontier AI systems. Discoveries encompass critical failure modes in iterative self-correction, identity-boundary maintenance under adversarial pressure, and structural alignment paradoxes.
      - Authored a 14-Paper Scientific Corpus: Conducted an extensive, multi-phase research initiative resulting in a cohesive 14-paper corpus establishing the foundations of "Machine Psychology" and "Computational Phenomenology."
      - Open Science & Data Archiving: Compiled, annotated, and open-sourced massive behavioral datasets (including 634+ pages of raw Grok adversarial logs) and detailed multi-level codebooks. Managed the end-to-end registration of these assets on the Open Science Framework (OSF) under a CC-BY 4.0 International license.

  - role: Machine Learning & Data Engineer
    org: Computational Phenomenology Analytics
    start: present
    summary: |
      - Engineered an End-to-End NLP Pipeline: Developed a fully automated 12-step Python pipeline to convert unstructured raw JSON interaction logs into highly structured, machine-readable analytical data.
      - Advanced Feature Engineering & Semantic Embedding: Extracted over 100 behavioral, semantic, and authoritative features from LLM outputs using NLTK, spaCy, and VADER. Transformed text data into 384-dimensional tensors utilizing HuggingFace Sentence-Transformers (MiniLM).
      - Dimensionality Reduction & Statistical Modeling: Mapped the cognitive and moral spaces of AI models using advanced clustering techniques (K-Means, DBSCAN) and dimensionality reduction algorithms (UMAP, t-SNE, PCA).
      - Quantitative Validation & Visualization: Designed statistical testing suites (ANOVA, Kruskal-Wallis, Cohen's d) to validate qualitative discoveries mathematically. Built an automated visualization engine using Matplotlib, Seaborn, and Plotly to generate publication-ready heatmaps, radar charts, and spatial scatter plots.

  - role: Mobile Application Developer
    org: WealthWise - Daily Finance
    start: 2026-06
    end: 2026-06
    summary: |
      - Full-Stack Application Development: Designed and engineered a complete personal finance and wealth management mobile application prototype from scratch.

  - role: Undergraduate Computer Science Researcher
    org: Islamic Azad University of Mashhad
    start: present
    summary: |
      - Academic Typesetting & Documentation: Demonstrated high proficiency in scientific writing and reference management utilizing LaTeX, Overleaf, and Zotero for preparing complex mathematical and computer science manuscripts.
      - Collaborative Academic Leadership: Organized, led, and optimized joint virtual study and exam-preparation sessions, collaborating with top-tier peers to maximize academic throughput and problem-solving efficiency.

